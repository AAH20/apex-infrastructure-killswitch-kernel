[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-infrastructure-killswitch-kernel"
version = "0.1.0"
description = "Apex Infrastructure Kill-Switch Orchestration Kernel solving the NP-hard bottlenecks of substation relay coordination, 4D tensor pipeline bubble shedding, complex impedance current splitting, resonant turbine speed avoidance, and latency-discounted dead-man AMM clearing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed@example.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
killswitch-kernel = "apex_infrastructure_killswitch_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apex_infrastructure_killswitch_kernel*"]
